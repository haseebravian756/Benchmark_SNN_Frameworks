# Experiment 2 -- each framework OUT OF THE BOX.
#
# Experiment 1 forced all three frameworks to compute ONE neuron, so that only the
# implementation could differ. This config does the opposite: it uses each
# framework's own default and its own documented event-data example, and lets the
# three neurons be genuinely different.
#
#   python train.py --config config/config_ex2.yaml --experiment ex2 \
#       --framework <fw> --seed <s> --results-root <drive>
#
# Design, equations and every source link: experiments/ex2/ex2_design.md
#
# ---------------------------------------------------------------------------
# ONLY the neuron block is overridden. Everything else -- dataset, framing,
# architecture, optimiser, learning rate, loss, timesteps, batch size, metrics --
# is inherited from default.yaml, unchanged.
#
# WHY: the frameworks' own examples use entirely different recipes (different
# datasets, batch 128 vs 16, lr 2e-2 vs 0.1, different losses, 1 vs 64 epochs).
# Adopting all of that per framework would make every metric incomparable -- you
# would be comparing training recipes, not frameworks. Holding everything except
# the neuron fixed keeps every column of runs.csv meaning the same thing in every
# row. See ex2_design.md section 5.
#
# NOTE FOR LATER: if ex2's results turn out to be the more authentic picture --
# these being the values the frameworks themselves put forward -- the plan is to
# promote them into default.yaml and make this the baseline. Until that decision
# is made, default.yaml stays as the forced-equivalence config from ex1.
# ---------------------------------------------------------------------------
extends: default.yaml

# ---------------------------------------------------------------------------
# Each value below is labelled with where it comes from. Keeping these apart is
# the main way this experiment could go wrong, so the labels are not decoration:
#
#   (D)  constructor default -- what you get from Neuron() with no arguments
#   (E)  the framework's own EVENT-DATA example passes this explicitly
#   (F)  forced by our shared pipeline, NOT out-of-the-box -- declared as a
#        limitation in the report
#
# The sub-threshold neuron is one line:   v[t] = d * v[t-1] + g * x[t]
# and two derived numbers describe it:
#   tau      = -1 / ln(d)        how many timesteps it remembers
#   DC gain  = g / (1 - d)       how excitable it is
# ---------------------------------------------------------------------------
neuron:

  # ⚠⚠ SINABS IS DELIBERATELY NOT OVERRIDDEN HERE, AND THAT MAKES IT UNSAFE TO
  # RUN EX2 WITH --framework sinabs. READ THIS BEFORE DOING SO.
  #
  # `extends: default.yaml` means this file INHERITS default.yaml's sinabs block,
  # and that block holds ex1's FORCED values -- the exact opposite of sinabs' own
  # defaults in all three places that matter:
  #
  #     setting            inherited here    sinabs' actual (D) default
  #     norm_input         false             true
  #     spike_fn           single            multi   (MultiSpike)
  #     reset_mechanism    zero (hard)       subtract (soft, MembraneSubtract)
  #
  # So a `--framework sinabs` run against THIS config would compare three
  # frameworks at their out-of-the-box defaults against a sinabs that has been
  # forced into ex1's neuron -- and would report it as out-of-the-box. Nothing in
  # the code can detect that; the values are all individually valid.
  #
  # RESOLVED 2026-08-13: the sinabs block IS now overridden, at the bottom of this
  # neuron section. The answer turned out to be more interesting than a number --
  # read the block, because out of the box sinabs gives you a NON-LEAKY neuron.

  snntorch:
    # snn.Leaky update (docs):  U[t+1] = beta*U[t] + I_in[t+1] - R*U_thr
    # so d = beta, and g = 1 -- the input enters at FULL strength, decoupled from
    # the decay. snnTorch is the only one of the three with a free gain.
    #
    # (E) beta has NO CONSTRUCTOR DEFAULT -- snnTorch requires it, so the library
    #     ships no out-of-the-box time constant at all. 0.5 is the value its own
    #     N-MNIST tutorial uses:
    #     https://snntorch.readthedocs.io/en/latest/tutorials/tutorial_7.html
    #
    #     d = 0.5  ->  tau = 1.44 steps,  DC gain = 1/(1-0.5) = 2.0
    #     That DC gain of 2.0 is TWICE the other two frameworks'. Measured
    #     consequence: at a constant input of 0.6 against threshold 1.0, snnTorch
    #     fires repeatedly while SpikingJelly and Norse never reach threshold.
    beta: 0.5

    # (D) https://snntorch.readthedocs.io/en/latest/snn.neurons_leaky.html
    threshold: 1.0

    # (D) DIFFERS FROM EX1, which forced "zero". "subtract" is a SOFT reset: it
    #     takes the threshold off and keeps the remainder, so a strongly driven
    #     neuron fires again sooner. A genuinely different neuron, not a detail.
    reset_mechanism: subtract

    # (D) DIFFERS FROM EX1, which forced false. True defers a spike's reset to the
    #     FOLLOWING timestep. Verified behaviour: v[t+1] = beta*v[t] + I - S[t]*thr,
    #     i.e. the subtraction arrives one step late. SpikingJelly and Norse both
    #     reset immediately, so this is a real three-way divergence.
    reset_delay: true

    # (D)+(E) spike_grad=None resolves to atan() internally, whose own default
    #         alpha is 2.0; Tutorial 7 also passes surrogate.atan() explicitly.
    #         So default and recommended practice agree here -- the only parameter
    #         in this file where all three of (D), (E) and ex1 coincide.
    surrogate:
      type: atan
      alpha: 2.0

  spikingjelly:
    # LIFNode update (docs), decay_input=True:
    #   H[t] = V[t-1] + (1/tau)*( X[t] - (V[t-1] - V_reset) )
    # With V_reset=0 that is   d = 1 - 1/tau,  g = 1/tau.
    # Unlike snnTorch, decay and gain are TIED by the flag: decay_input=True gives
    # g = 1/tau, false gives g = 1. There is no free choice in between.
    #
    # (D)+(E) DIFFERS FROM EX1, which forced tau=10.0 to reach decay 0.9.
    #         SpikingJelly's own DVS-Gesture example does not pass tau at all, so
    #         the default stands. Independently corroborated by Fang et al.,
    #         ICCV 2021, which uses init_tau 2.0 on DVS128 Gesture -- the same
    #         group that wrote SpikingJelly.
    #
    #         d = 1 - 1/2 = 0.5  ->  tau_eff = 1.44 steps
    #         Coincidentally IDENTICAL decay to snnTorch's 0.5 above. Nobody
    #         coordinated this; 1 - 1/2 simply lands on the same number.
    tau: 2.0

    # (D)+(E) DIFFERS FROM EX1, which forced false to get gain 1.0.
    #         True makes g = 1/tau = 0.5, hence DC gain = 0.5/(1-0.5) = 1.0.
    decay_input: true

    v_threshold: 1.0        # (D)
    v_reset: 0.0            # (D) a number means HARD reset; null would mean soft

    # (E) DIFFERS FROM EX1 (false) *and* from SpikingJelly's own constructor
    #     default (also false). Its event example passes True.
    #
    #     This is one of TWO places where SpikingJelly's own recommended practice
    #     contradicts its own defaults. We follow the example, because the
    #     question this experiment asks is "what if you do what the framework
    #     tells you to do for event data" -- and a shipped, documented example is
    #     what it tells you. config/config_ex2_bare.yaml takes the other branch.
    #
    #     Not cosmetic: measured in ex1, flipping this changed d(spikes)/d(weight)
    #     from 2.64 to 4.34 on a 6-step test.
    detach_reset: true

    # (F) FORCED, not out-of-the-box. Our shared network loops over timesteps and
    #     hands each layer one frame, which is what 's' means. SpikingJelly's fused
    #     CUDA kernel needs 'm' plus the whole [T,...] tensor. Verified in ex1 that
    #     'm' and looped 's' produce IDENTICAL spikes, so this caps measured speed
    #     without affecting correctness. Same limitation as ex1's L2, and the
    #     reason a multi-step + cupy run is the planned follow-up.
    step_mode: s
    backend: torch

    # (E) The second disagreement. Constructor default is Sigmoid(alpha=4.0); the
    #     event example passes ATan(). Following the example.
    surrogate:
      type: atan
      alpha: 2.0

  norse:
    # LIFBoxCell, one Euler step of  v_dot = (1/tau_mem)*(v_leak - v + i):
    #   v[t] = (1 - dt*tau_mem_inv)*v[t-1] + (dt*tau_mem_inv)*x[t]
    #
    # So with a = dt*tau_mem_inv:  d = 1 - a  and  g = a.
    # DECAY AND GAIN ARE LOCKED: g = 1 - d. Both come from the single product, so
    # they cannot be set independently. Structural to the discretised ODE, not a
    # missing feature -- and precisely why ex1 needed an external input_scale.
    #
    # (D) for both: https://norse.github.io/norse/generated/norse.torch.module.lif_box.LIFBoxCell.html
    #     a = 0.001 * 100 = 0.1  ->  d = 0.9, g = 0.1
    #     tau_eff = 9.49 steps -- about 6.6x LONGER memory than the other two,
    #     and DC gain = 0.1/(1-0.9) = 1.0.
    dt: 0.001
    tau_mem_inv: 100.0

    v_th: 1.0               # (D)
    v_reset: 0.0            # (D)
    v_leak: 0.0             # (D)
    reset_method: value     # (D) HARD reset

    # DIFFERS FROM EX1, which used 10.0 to cancel the locked gain and force an
    # effective gain of 1.0. Out of the box there is no such factor, so 1.0 here
    # means "no rescaling at all" -- the gain stays at its locked 0.1.
    # Removing this scaffolding is the point of the experiment.
    input_scale: 1.0

    # (D) DIFFERS FROM EX1, which deliberately used circ(0.5) to approximate
    #     atan(2.0) and avoid the bug below.
    #
    #     *** alpha HAS NO EFFECT in norse 1.1.0. ***
    #     The installed backward is
    #         grad_output / (|x| + 1)^2
    #     with ctx.alpha stored and never read -- so alpha = 1, 10 and 100 give
    #     byte-identical gradients and the surrogate always behaves as alpha = 1.
    #     Upstream main has the fix:
    #         grad_output / (alpha*|x| + 1)^2
    #     merged as commit 1d2671a (Aug 2024) but NEVER RELEASED; 1.1.0 is still
    #     current on PyPI.
    #
    #     Ex1 avoided this. Ex2 must NOT avoid it: a user following the defaults
    #     gets the buggy surrogate, so this is the honest out-of-the-box
    #     condition, and the bug becomes a measured result rather than a footnote.
    #     Consequence measured in ex1: effective alpha=1 gave a conv1 gradient
    #     norm 6.03x the other two frameworks', so at a shared learning rate
    #     Norse effectively trains at ~6x the step size.
    #
    #     Evidence figure: python probe_norse_alpha.py --experiment ex2
    #     Full write-up:   local_docs/norse_superspike_alpha_finding.md
    surrogate:
      type: super
      alpha: 100.0

  sinabs:
    # sinabs LIF update:  v = alpha*v + (1-alpha)*x   (norm_input=true)
    #                     v = alpha*v +         x     (norm_input=false)
    # with alpha = exp(-1/tau_mem), and NO dt -- tau_mem is already in timesteps.
    #
    # =====================================================================
    # THE FINDING: OUT OF THE BOX, SINABS DOES NOT GIVE YOU A LEAKY NEURON.
    # =====================================================================
    # `sinabs.layers.LIF` has NO default tau_mem -- it is a required positional
    # argument, exactly like snnTorch's `beta`. So kind (D) does not exist for it.
    #
    # Kind (E) does not exist either, and that is the interesting part. EVERY ONE
    # of sinabs' own examples uses IAF, never LIF -- checked, all four:
    #
    #   docs/tutorials/nmnist.ipynb              (N-MNIST, BPTT via EXODUS)
    #       backend.IAFSqueeze(batch_size=batch_size, min_v_mem=-1)
    #   docs/speck/notebooks/nmnist_quick_start.ipynb   (N-MNIST)
    #       sl.IAFSqueeze(batch_size=batch_size, min_v_mem=-1.0,
    #                     surrogate_grad_fn=PeriodicExponential())
    #   examples/visualizer/gesture_viz.py       (DVS128 Gesture) -> from_model()
    #   docs/tutorials/bptt.ipynb                (Sequential MNIST) -> from_model()
    #
    # and `from_model()`, sinabs' headline ANN->SNN converter, defaults to
    # `spike_layer_class = sl.IAFSqueeze` (read from the installed
    # sinabs/from_torch.py:26).
    #
    # IAF IS LITERALLY `LIF` WITH THE LEAK TURNED OFF. sinabs/layers/iaf.py calls
    # super().__init__(tau_mem=np.inf, ..., norm_input=False), so
    # alpha = exp(-1/inf) = 1. Verified on the installed package: IAF() reports
    # alpha_mem_calculated = 1.0.
    #
    # So the honest out-of-the-box sinabs neuron for event data is expressed here
    # as tau_mem = infinity. This is NOT a workaround -- it reproduces sinabs' own
    # IAF exactly, through the LIF class the adapter already uses.
    #
    # (E) -- from all four examples above, plus (D) of from_model's
    #        spike_layer_class. d = 1.0 exactly: the membrane NEVER leaks.
    tau_mem: .inf

    tau_syn: null           # (D) first-order, one state

    # FORCED, and mathematically forced, not a preference: with alpha = 1 the
    # normalised gain would be 1 - alpha = 0 and the neuron would be completely
    # DEAF -- no input could ever enter. sinabs' own IAF hardcodes False for this
    # exact reason. So d = 1.0, g = 1.0.
    norm_input: false

    spike_threshold: 1.0    # (D) of LIF, and of from_model

    # (D) MultiSpike. ONE neuron may emit 2, 3 or more spikes in a SINGLE
    # timestep -- all three other frameworks emit a binary spike.
    #
    # ⚠ THIS BREAKS THE SPIKE-RATE COLUMN. src/adapters/base.py documents
    # spike_rate() as a FRACTION (spikes per neuron per timestep); with multi it
    # can exceed 1.0, i.e. >100%. The sinabs spike_rate_pct in ex2 is therefore
    # NOT comparable with the other three. Report it, do not rank it.
    spike_fn: multi

    # (D) MembraneSubtract -- SOFT reset, keeps the remainder above threshold.
    reset_mechanism: subtract
    v_reset: 0.0            # unused while reset_mechanism is "subtract"

    # (E) BOTH N-MNIST tutorials pass min_v_mem=-1.0 explicitly, and it is also
    # the (D) of from_model (sinabs/from_torch.py:20). A floor on how negative the
    # membrane may go. NONE of the other three frameworks offers this knob at all,
    # so it is a sinabs-only asymmetry and belongs in the write-up.
    min_v_mem: -1.0

    train_alphas: false     # (D). NOTE: the adapter freezes the parameter anyway.
    record_states: false    # (D)

    # (E) PeriodicExponential, from the N-MNIST BPTT example above. The (D) would
    # be SingleExponential; ex2 prefers (E) where the framework's own event-data
    # example is explicit, the same rule applied to SpikingJelly's ATan above.
    #
    # It is the coherent choice rather than an arbitrary one: PeriodicExponential
    # repeats its gradient window at every multiple of the threshold, which is
    # what a MultiSpike neuron needs -- a single-window surrogate gives no
    # gradient to the 2nd or 3rd spike of a timestep.
    #
    # Both parameters are PeriodicExponential's own defaults.
    surrogate:
      type: periodic_exponential
      grad_width: 0.5
      grad_scale: 1.0

    # ---------------------------------------------------------------------
    # WHAT THIS MEANS FOR THE COMPARISON -- state it in the report.
    #
    # On the common scale  v[t] = d*v[t-1] + g*x[t]:
    #
    #                 d       g       tau (steps)   DC gain
    #   snntorch      0.5     1.0     1.44          2.0
    #   spikingjelly  0.5     0.5     1.44          1.0
    #   norse         0.9     0.1     9.49          1.0
    #   sinabs        1.0     1.0     INFINITE      UNDEFINED  (g/(1-d) = 1/0)
    #
    # Three consequences that are RESULTS, not problems:
    #   1. sinabs is the only one with perfect memory. It never forgets, so a
    #      constant input accumulates without bound and DC gain is undefined --
    #      the column simply cannot be filled in for sinabs.
    #   2. It is the only NON-leaky neuron in the comparison, so ex2 is
    #      "three leaky neurons and one integrator", by the libraries' own
    #      choices. That IS the out-of-the-box answer.
    #   3. no-leak + MultiSpike + subtract-reset are exactly the three conditions
    #      under which a spiking neuron's firing rate equals ReLU. sinabs'
    #      defaults are not a neuron-modelling choice, they are an ANN-conversion
    #      guarantee. See local_docs/SNNs_Introduction_BaseConcepts.md section 4.
    # ---------------------------------------------------------------------
